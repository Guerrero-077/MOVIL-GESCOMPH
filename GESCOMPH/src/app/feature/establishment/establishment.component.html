<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-sm="6" size-md="4" size-lg="3"
      *ngFor="let establishment of establishments">
        <app-card
          [local]="establishment"
          [showAvailableTag]="true"
          (onDelete)="handleDelete(establishment.id)"
          (onUpdate)="onCardUpdated()"
          (onView)="onView($event)"
          (onEdit)="openEditDialogById(establishment.id)"
        ></app-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
